{% extends "admin/index.html" %}
{% load i18n static %}

{% block content %}
{{ block.super }}

<style>
    .custom-actions-module {
        margin-top: 30px;
        background: transparent;
        border-radius: 8px;
        padding: 20px;
    }
    .custom-actions-module h2 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 15px;
        color: var(--header-color, #f5f5f5);
        border-bottom: 2px solid #417690;
        padding-bottom: 10px;
    }
    .action-buttons {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
    }
    .action-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.3s;
        cursor: pointer;
    }
    .action-btn-backup {
        background: #417690;
        color: white;
    }
    .action-btn-backup:hover {
        background: #2e5666;
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(65,118,144,0.3);
    }
    .action-btn-clear {
        background: #dc3545;
        color: white;
    }
    .action-btn-clear:hover {
        background: #c82333;
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(220,53,69,0.3);
    }
    .action-icon {
        font-size: 18px;
    }
    .action-description {
        margin-top: 15px;
        padding: 15px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
        font-size: 14px;
        line-height: 1.6;
        color: var(--body-fg, #d0d0d0);
    }
    .action-description ul {
        margin: 10px 0 0 0;
        padding-left: 20px;
    }
    .action-description li {
        margin: 5px 0;
    }
</style>

<div class="custom-actions-module">
    <h2>数据库管理</h2>

    <div class="action-buttons">
        <a href="{% url 'admin_backup_database' %}" class="action-btn action-btn-backup">
            <span class="action-icon">💾</span>
            <span>备份数据库</span>
        </a>

        <a href="{% url 'admin_clear_history' %}" class="action-btn action-btn-clear">
            <span class="action-icon">🗑️</span>
            <span>清除历史数据</span>
        </a>
    </div>

    <div class="action-description">
        <p><strong>功能说明：</strong></p>
        <ul>
            <li><strong>备份数据库：</strong>创建数据库的完整备份文件，保存在 backend/backups 目录。建议定期备份以防数据丢失。</li>
            <li><strong>清除历史数据：</strong>删除检测结果、缺陷记录等历史数据以释放空间。系统配置不会被删除。<strong>操作前请先备份！</strong></li>
        </ul>
    </div>
</div>
{% endblock %}
