services:
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: qwen-vllm-server
    ports:
      - "8000:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=""
    command: >
      --model /app/models/Qwen2.5-VL-7B-Instruct
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --served-model-name Qwen/Qwen2.5-VL-7B-Instruct
      --device cpu
      --enforce-eager
    volumes:
      - ./models:/app/models
    restart: unless-stopped
