[supervisord]
nodaemon=true
user=app
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
user=root

[program:django]
command=gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 --keep-alive 2 --max-requests 1000 --max-requests-jitter 100 --access-logfile /app/logs/gunicorn_access.log --error-logfile /app/logs/gunicorn_error.log backend.wsgi:application
directory=/app/backend
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/django.err.log
stdout_logfile=/var/log/supervisor/django.out.log
user=app
environment=PATH="/usr/local/bin:%(ENV_PATH)s"

[program:celery]
command=celery -A backend worker --loglevel=info --concurrency=2
directory=/app/backend
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/celery.err.log
stdout_logfile=/var/log/supervisor/celery.out.log
user=app
environment=PATH="/usr/local/bin:%(ENV_PATH)s"

[program:celery-beat]
command=celery -A backend beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
directory=/app/backend
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/celery-beat.err.log
stdout_logfile=/var/log/supervisor/celery-beat.out.log
user=app
environment=PATH="/usr/local/bin:%(ENV_PATH)s"
